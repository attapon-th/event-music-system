services:
  event-music:
    image: attap0n/qp:latest
    build: .
    container_name: qp
    restart: unless-stopped

    # Traefik terminates TLS and forwards requests over the shared proxy network.
    networks:
      - proxy
    ports:
      - "${PORT:-45416}:${PORT:-45416}"

    env_file:
      - .env
    environment:
      PORT: ${PORT:-45416}
      DEFAULT_REGION: ${DEFAULT_REGION:-TH}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-th-TH}
      # Public address the QR code points guests to (your reverse-proxy domain).
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:-qp-attapon-th.github.io}}

networks:
  proxy:
    external: true
