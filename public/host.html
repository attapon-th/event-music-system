<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#211827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="คิวเพลิน" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/qp.svg" />
  <link rel="icon" sizes="16x16 32x32" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/icons/qp-180.png" />
  <title data-i18n="Event Music — Now Playing">คิวเพลิน — กำลังเล่น</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/host.css" />
  <link rel="stylesheet" href="/session.css" />
</head>
<body data-screen="player">
  <div id="room-content" hidden>
  <main id="stage">
    <div id="player-wrap" tabindex="-1">
      <div id="player"></div>
      <div id="idle" class="hidden">
        <div class="idle-emoji">🎧</div>
        <p data-i18n="No song playing">ยังไม่มีเพลง</p>
        <p class="idle-sub" id="request-hint" data-i18n="Scan the QR code to add the first song!">สแกน QR เพื่อเพิ่มเพลงแรก</p>
      </div>
      <button id="fullscreen" type="button" title="วิดีโอเต็มจอ (F)" aria-label="วิดีโอเต็มจอ (F)" aria-pressed="false" data-i18n-title="Video fullscreen (f)" data-i18n-aria-label="Video fullscreen (f)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 3H3v6m12-6h6v6M3 15v6h6m12-6v6h-6" /></svg>
      </button>
    </div>

    <div id="now-meta">
      <button id="playpause" class="player-button" type="button" data-i18n-title="Play / Pause (space)" data-i18n-aria-label="Play / Pause (space)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4.5" height="14" rx="1.5"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"/></svg>
      </button>
      <button id="skip" class="player-button" type="button" data-i18n-title="Skip (n)" data-i18n-aria-label="Skip (n)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5v14l10-7z"/><rect x="17" y="5" width="2.6" height="14" rx="1"/></svg>
      </button>
      <div class="now-song">
        <div id="now-title">—</div>
        <div id="now-channel"></div>
      </div>
    </div>

    <aside id="player-sidebar" class="sidebar">
      <div id="qr-card" class="qr-card" hidden>
        <div class="qr-title" data-i18n="Scan to request a song">สแกนเพื่อเพิ่มเพลง</div>
        <div class="qr-frame"><img id="qr" alt="คิวอาร์โค้ด" data-i18n-alt="QR code" /></div>
        <div id="player-room-label"></div>
        <div id="guest-url" class="guest-url"></div>
      </div>
      <div id="player-queue-card" class="queue-card">
        <div class="queue-head">
          <span data-i18n="queue"></span> <small data-i18n="Up Next">Up Next</small> <span id="queue-count" class="count">0</span>
        </div>
        <ul id="queue"></ul>
      </div>
    </aside>
    <div id="controls">
      <div class="vol">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.6l4.9 4V5.5l-4.9 4H4z" fill="currentColor"/><path d="M16.2 9.3a4.3 4.3 0 010 5.9m2.4-8a8 8 0 010 10.9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
        <input id="volume" aria-label="ระดับเสียง" data-i18n-aria-label="volume" type="range" min="0" max="100" value="60" />
      </div>
      <button id="exit-room" class="player-button" type="button" aria-haspopup="dialog" data-i18n-title="exitPlayer" data-i18n-aria-label="exitPlayer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H4v16h6m4-13 5 5-5 5m5-5H9"/></svg>
      </button>
    </div>
    <p id="player-status" role="status" aria-live="polite"></p>
  </main>

  <dialog id="exit-dialog" aria-labelledby="exit-title" aria-describedby="exit-description">
    <h2 id="exit-title" data-i18n="confirmExitPlayer">ออกจากห้องนี้หรือไม่?</h2>
    <p id="exit-description" data-i18n="exitPlayerDescription">เครื่องเล่นนี้จะหยุดเล่นและกลับหน้าแรก</p>
    <div class="exit-actions">
      <button id="cancel-exit" type="button" data-i18n="cancel" autofocus>ยกเลิก</button>
      <button id="confirm-exit" type="button" data-i18n="exitPlayer">ออกจากห้อง</button>
    </div>
  </dialog>
  </div>
  <script src="/i18n.js"></script>
  <script src="/session.js"></script>
  <script src="/pwa.js"></script>
  <script src="/host.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
