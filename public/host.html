<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="Event Music — Now Playing">ระบบเพลงส่วนกลาง — กำลังเล่น</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/host.css" />
</head>
<body>
  <!-- One click here unlocks browser autoplay so audio reaches the AV system. -->
  <div id="start-overlay">
    <div class="start-card">
      <div class="start-logo">🎶</div>
      <h1 data-i18n="Event Music System">ระบบเพลงส่วนกลาง</h1>
      <p data-i18n="Click to start the jukebox.">กดเพื่อเริ่มเล่นเพลง</p>
      <button id="start-btn" data-i18n="▶  Start">▶ เริ่มเล่น</button>
      <small data-i18n="Make sure this window's audio goes to the venue's AV system.">ตรวจสอบว่าเสียงจากเครื่องนี้เชื่อมต่อกับลำโพงแล้ว</small>
    </div>
  </div>

  <main id="stage" class="hidden">
    <section class="player-pane">
      <div id="player-wrap">
        <div id="player"></div>
        <div id="idle" class="hidden">
          <div class="idle-emoji">🎧</div>
          <p data-i18n="暫時未有歌曲">ยังไม่มีเพลง</p>
          <p class="idle-sub" data-i18n="掃描 QR code，點播第一首歌！Scan the QR code to add the first one!">สแกน QR เพื่อเพิ่มเพลงแรก</p>
        </div>
      </div>
      <div id="now-meta">
        <div id="now-label" class="now-label hidden">
          <span class="eq"><span></span><span></span><span></span></span>
          <span class="np-zh" data-i18n="現正播放">กำลังเล่น</span>
          <span class="np-en" data-i18n="Now Playing">กำลังเล่น</span>
        </div>
        <div id="now-title">—</div>
        <div id="now-channel"></div>
      </div>
      <a href="/admin" data-i18n="admin">ผู้ดูแลเพลง</a>
      <div id="controls">
        <button id="playpause" title="เล่น / หยุดชั่วคราว (Space)" data-i18n-title="Play / Pause (space)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.5"></rect><rect x="13.5" y="5" width="4.5" height="14" rx="1.5"></rect></svg>
        </button>
        <button id="skip" title="ข้ามเพลง (N)" data-i18n-title="Skip (n)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5v14l10-7z"></path><rect x="17" y="5" width="2.6" height="14" rx="1"></rect></svg>
        </button>
        <button id="filter-toggle" class="pill" title="ตัวกรอง: ปิด → เปิด → เข้มงวด" data-i18n-title="內容過濾 — 點按循環：關 → 開 → 嚴格（只限老少咸宜）" data-i18n="過濾">ตัวกรอง</button>
        <span id="filter-hint" class="filter-hint hidden" data-i18n="no LLM key — accepts all">ไม่ได้ตั้งค่า LLM — รับทุกเพลง</span>
        <button id="cooldown-toggle" class="pill" title="เวลารอเพิ่มเพลงต่อคน — กดเพื่อเปลี่ยน" data-i18n-title="Per-guest request cooldown — click to change" data-i18n="冷卻">เวลารอ</button>
        <button id="context-toggle" class="pill" title="ระบุประเภทงานสำหรับตัวกรอง AI" data-i18n-title="活動場景 — tell the AI filter what kind of event this is">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-4.3-6.5-10a6.5 6.5 0 0113 0c0 5.7-6.5 10-6.5 10z"></path><circle cx="12" cy="10.5" r="2.4"></circle></svg>
          <span data-i18n="場景">ประเภทงาน</span>
        </button>
        <div class="vol">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 9.5v5h3.6l4.9 4V5.5l-4.9 4H4z" fill="currentColor"></path><path d="M16.2 9.3a4.3 4.3 0 010 5.9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path><path d="M18.6 6.8a8 8 0 010 10.9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
          <input id="volume" aria-label="ระดับเสียง" data-i18n-aria-label="volume" type="range" min="0" max="100" value="100" />
        </div>
      </div>
      <div id="context-row" class="context-row hidden">
        <input id="context-input" type="text" maxlength="300"
               placeholder="ประเภทงาน เช่น งานเลี้ยงจบการศึกษา งานแต่งงาน" data-i18n-placeholder="這是什麼活動？例：a secondary school graduation dinner in Hong Kong / a wedding banquet…" />
        <button id="context-save" data-i18n="儲存">บันทึก</button>
      </div>
    </section>

    <aside class="sidebar">
      <div class="qr-card">
        <div class="qr-title" data-i18n="掃碼點歌">สแกนเพื่อเพิ่มเพลง</div>
        <div class="qr-sub" data-i18n="Scan to add a song">เลือกเพลงจากโทรศัพท์</div>
        <div class="qr-frame"><img id="qr" alt="คิวอาร์โค้ด" data-i18n-alt="QR code" /></div>
        <div id="guest-url" class="guest-url"></div>
      </div>
      <div class="queue-card">
        <div class="queue-head">
          <span data-i18n="queue"></span> <small data-i18n="Up Next">เพลงถัดไป</small> <span id="queue-count" class="count">0</span>
        </div>
        <ul id="queue"></ul>
      </div>
    </aside>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="/i18n.js"></script>
  <script src="/host.js"></script>
</body>
</html>
