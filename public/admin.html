<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="admin">ผู้ดูแลเพลง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/guest.css" />
  <link rel="stylesheet" href="/admin.css" />
  <link rel="stylesheet" href="/session.css" />
</head>
<body data-admin="true">
  <div id="room-content" hidden>
  <header>
    <h1 id="admin-title" data-i18n="admin">ผู้ดูแลเพลง</h1>
    <p id="connection" role="status"></p>
  </header>

  <div id="now-playing" class="now-playing hidden"></div>

  <section class="admin-controls" aria-label="ควบคุมเพลง">
    <button id="admin-play" type="button" data-i18n-title="play" data-i18n-aria-label="play" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg></button>
    <button id="admin-pause" type="button" data-i18n-title="pause" data-i18n-aria-label="pause" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
    <button id="admin-skip" type="button" data-i18n-title="skip" data-i18n-aria-label="skip" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 5 12 7-12 7Z"/><path d="M19 5v14"/></svg></button>
    <button id="admin-auto-queue" type="button" aria-pressed="false" disabled>เล่นต่ออัตโนมัติ: ปิด</button>
    <label><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9Z"/><path d="M16 8a6 6 0 0 1 0 8"/></svg> <output id="admin-volume-value">60%</output>
      <input id="admin-volume" type="range" min="0" max="100" value="60" aria-label="ระดับเสียง" data-i18n-aria-label="volume" disabled />
    </label>
    <button id="admin-clear" type="button" hidden data-i18n-title="clear" data-i18n-aria-label="clear" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg></button>
    <button id="admin-cooldown" type="button" data-i18n-title="Per-guest request cooldown — click to change" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="admin-cooldown-label"></span></button>
  </section>
  <p id="auto-queue-status" role="status" aria-live="polite"></p>
  <p id="admin-feedback" role="status" aria-live="polite"></p>
  <div class="page-tabs" role="tablist" aria-label="ค้นหาและคิวเพลง">
    <button id="search-tab" type="button" role="tab" aria-selected="true" aria-controls="search-panel"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.1 15.1 4.4 4.4"/></svg><span data-i18n="Search"></span></button>
    <button id="queue-tab" type="button" role="tab" aria-selected="false" aria-controls="queue-panel" tabindex="-1"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h12"/></svg><span data-i18n="queue"></span></button>
    <button id="participants-tab" type="button" role="tab" aria-selected="false" aria-controls="participants-panel" tabindex="-1" data-i18n="participants"></button>
  </div>

  <section id="search-panel" role="tabpanel" aria-labelledby="search-tab">
    <h2 id="request-title">เพิ่มเพลง</h2>

    <div class="search-modes" role="group" aria-label="โหมดค้นหา" data-i18n-aria-label="searchMode">
      <button id="mode-videos" type="button" aria-pressed="true" data-i18n="videos"></button>
      <button id="mode-karaoke" type="button" aria-pressed="false" data-i18n="karaoke"></button>
      <button id="mode-songs" type="button" aria-pressed="false" data-i18n="songs"></button>
    </div>
    <form id="search-form">
      <input id="q" type="search" placeholder="ค้นหาเพลงหรือศิลปิน…" data-i18n-placeholder="Search songs or artists…"
             autocomplete="off" enterkeyhint="search" />
      <button type="submit" id="search-btn" aria-label="ค้นหาเพลง" data-i18n-aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="M19.5 19.5l-4.3-4.3"></path></svg>
      </button>
    </form>

    <section id="suggestions-section">
      <div class="sug-head">
        <span class="sec-title"><span data-i18n="explore"></span> <small data-i18n="Explore">Explore</small></span>
        <button id="shuffle" class="shuffle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7h3.8L16 17.2h4.5"></path><path d="M3.5 17h3.8L10 13"></path><path d="M15.5 7h5"></path><path d="M18.2 4.3L20.5 7l-2.3 2.7"></path><path d="M18.2 14.5l2.3 2.5-2.3 2.7"></path></svg>
          <span data-i18n="Shuffle"></span>
        </button>
      </div>
      <div id="singers" class="singers"></div>
      <div id="genre-tabs" class="genre-tabs"></div>
    </section>

    <button id="back-to-explore" class="back-to-explore hidden" data-i18n="Back to Explore">← กลับไปสำรวจเพลง</button>
    <div id="status" class="status hidden"></div>
    <ul id="results"></ul>
    <button id="more" class="more hidden">
      <span data-i18n="More songs"></span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg>
    </button>

  </section>

  <section id="queue-panel" class="queue-section" role="tabpanel" aria-labelledby="queue-tab" hidden>
    <h2><span data-i18n="queue"></span> <small data-i18n="Up Next">Up Next</small> <span id="queue-count" class="count">0</span></h2>
    <ul id="queue"></ul>
  </section>

  <section id="participants-panel" role="tabpanel" aria-labelledby="participants-tab" hidden>
    <h2 data-i18n="participants">ผู้เข้าร่วม</h2>
    <ul id="participants-list"></ul>
  </section>

  <!-- Toast stack for request feedback (one card per in-flight request) -->
  <div id="toasts" class="toasts"></div>

  </div>
  <script src="/i18n.js"></script>
  <script src="/session.js"></script>
  <script src="/guest.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
