<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="admin">ผู้ดูแลเพลง</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/guest.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body data-admin="true">
  <header>
    <h1 data-i18n="admin">ผู้ดูแลเพลง</h1>
    <nav><a href="/" data-i18n="playerLink">เปิด Player</a> · <a href="/guest" data-i18n="guestLink">เปิดหน้าผู้ฟัง</a></nav>
    <p id="connection" role="status"></p>
  </header>

  <div id="now-playing" class="now-playing hidden"></div>

  <section class="admin-controls" aria-label="ควบคุมเพลง">
    <button id="admin-play" data-i18n="play" disabled></button>
    <button id="admin-pause" data-i18n="pause" disabled></button>
    <button id="admin-skip" data-i18n="skip" disabled></button>
    <label><span data-i18n="volume"></span> <output id="admin-volume-value">100%</output>
      <input id="admin-volume" type="range" min="0" max="100" value="100" aria-label="ระดับเสียง" data-i18n-aria-label="volume" disabled />
    </label>
    <button id="admin-clear" data-i18n="clear" disabled></button>
  </section>
  <p id="admin-feedback" role="status" aria-live="polite"></p>
  <div class="name-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.2" r="3.4"></circle><path d="M4.8 20c1.3-4.2 4.2-6.3 7.2-6.3s5.9 2.1 7.2 6.3"></path></svg>
    <input id="name" type="text" placeholder="ชื่อของคุณ (ไม่จำเป็น)" data-i18n-placeholder="你的名字（可不填）· your name (optional)" autocomplete="off" maxlength="40" />
  </div>
  <div class="name-hint" data-i18n="可不填 · 顯示於你點的歌旁 · optional, shown with your song">ชื่อจะแสดงข้างเพลงที่คุณเพิ่ม ไม่จำเป็นต้องกรอก</div>

  <form id="search-form">
    <input id="q" type="search" placeholder="ค้นหาเพลงหรือศิลปิน…" data-i18n-placeholder="搜尋歌曲或歌手…"
           autocomplete="off" enterkeyhint="search" />
    <button type="submit" id="search-btn" aria-label="ค้นหาเพลง" data-i18n-aria-label="Search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.3"></circle><path d="M19.5 19.5l-4.3-4.3"></path></svg>
    </button>
  </form>

  <div id="suggestions-section" class="hidden">
    <div id="singers"></div><div id="genre-tabs"></div><button id="shuffle" type="button"></button>
  </div>

  <button id="back-to-explore" class="back-to-explore hidden" data-i18n="← 返回點唱台 · Back to Explore">← กลับไปสำรวจเพลง</button>
  <div id="status" class="status hidden"></div>
  <ul id="results"></ul>
  <button id="more" class="more hidden">
    <span data-i18n="更多歌曲"></span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"></path></svg>
  </button>

  <section class="queue-section">
    <h2><span data-i18n="queue"></span> <small data-i18n="Up Next">เพลงถัดไป</small> <span id="queue-count" class="count">0</span></h2>
    <ul id="queue"></ul>
  </section>

  <!-- Toast stack for request feedback (one card per in-flight request) -->
  <div id="toasts" class="toasts"></div>

  <script src="/i18n.js"></script>
  <script src="/guest.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
